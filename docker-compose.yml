services:
  postgres:
    image: postgres:16-alpine
    container_name: auvora-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: auvora
      POSTGRES_PASSWORD: auvora
      POSTGRES_DB: auvora_wallet
    volumes:
      - auvora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auvora -d auvora_wallet']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auvora-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - auvora-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional application services (Phase 2).
  # Dockerfile.service builds any Nest service via --build-arg SERVICE=<name> (includes database/ for Prisma).
  # Run with: docker compose --profile services up -d
  #
  # auth:
  #   profiles: [services]
  #   build:
  #     context: .
  #     dockerfile: infrastructure/docker/Dockerfile.service
  #     args:
  #       SERVICE: auth
  #   container_name: auvora-auth
  #   restart: unless-stopped
  #   ports:
  #     - '4001:4001'
  #   environment:
  #     NODE_ENV: production
  #     PORT: 4001
  #     DATABASE_URL: postgresql://auvora:auvora@postgres:5432/auvora_wallet?schema=public
  #     REDIS_URL: redis://redis:6379
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #
  # gateway:
  #   profiles: [services]
  #   build:
  #     context: .
  #     dockerfile: infrastructure/docker/Dockerfile.service
  #     args:
  #       SERVICE: gateway
  #   container_name: auvora-gateway
  #   restart: unless-stopped
  #   ports:
  #     - '4000:4000'
  #   environment:
  #     NODE_ENV: production
  #     PORT: 4000
  #     AUTH_SERVICE_URL: http://auth:4001
  #     REDIS_URL: redis://redis:6379
  #   depends_on:
  #     auth:
  #       condition: service_started
  #     redis:
  #       condition: service_healthy

  # Local-only SMTP catcher for auth verification / reset emails.
  # Usage: docker compose --profile mail up -d
  # Then set in .env: MAIL_DRIVER=smtp SMTP_HOST=127.0.0.1 SMTP_PORT=1025 SMTP_FROM=noreply@auvora.local
  # UI: http://127.0.0.1:8025  (never use in production)
  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.22
    container_name: auvora-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # Isolated Auvora Local EVM QA (Anvil). Never mainnet / never public Sepolia.
  # Usage: docker compose --profile qa-evm up -d
  # RPC: http://127.0.0.1:8545  chainId 31337
  anvil:
    profiles: [qa-evm]
    image: ghcr.io/foundry-rs/foundry:stable
    container_name: auvora-anvil
    restart: unless-stopped
    entrypoint: ['anvil']
    command: [
        '--host',
        '0.0.0.0',
        '--port',
        '8545',
        '--chain-id',
        '31337',
        '--block-time',
        '1',
        '--accounts',
        '10',
        '--balance',
        '10000',
        # Persist Anvil state periodically so hard restarts keep Local EVM QA history.
        '--state',
        '/data/anvil-state.json',
        '--state-interval',
        '30',
      ]
    ports:
      - '8545:8545'
    volumes:
      - auvora-anvil-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s

volumes:
  auvora-postgres-data:
  auvora-redis-data:
  auvora-anvil-data:
