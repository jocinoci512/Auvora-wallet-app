name: auvora_wallet
description: Auvora Wallet — mobile-first self-custody (iOS, Android, tablet). Desktop companion is apps/web.
publish_to: 'none'
version: 1.0.0-alpha.1+5

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bip39: ^1.0.6
  convert: ^3.1.2
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  mobile_scanner: ^6.0.2
  permission_handler: ^11.4.0
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  shared_preferences: ^2.5.2
  uuid: ^4.5.1
  pointycastle: ^3.9.1
  http: ^1.6.0
  pinenacl: ^0.6.0
  url_launcher: ^6.3.2
  app_links: ^6.4.0
  intl: ^0.20.2
  reown_walletkit: ^1.3.8
  web3dart: ^2.7.3
  eth_sig_util: ^0.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
