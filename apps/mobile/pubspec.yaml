name: auvora_wallet
description: Auvora Wallet — mobile-first self-custody (iOS, Android, tablet). Desktop companion is apps/web.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bip39: ^1.0.6
  convert: ^3.1.2
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  permission_handler: ^11.4.0
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
