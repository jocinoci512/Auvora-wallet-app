global:
  namespace: auvora-wallet
  imageRegistry: auvora
  imageTag: latest
  environment: production
  pullPolicy: IfNotPresent
  # rolling | blue-green | canary
  deploymentStrategy: rolling
  blueGreen:
    # Pods created by this release
    slot: blue
    # Service traffic target (flip to cut over without rebuilding)
    activeSlot: blue
  canary:
    replicas: 1
    imageTag: ''
    weightPercent: 10

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  hpa:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  pdb:
    minAvailable: 1

config:
  NODE_ENV: production
  LOG_LEVEL: info
  OTEL_ENABLED: 'false'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  # Public surface URLs — override per environment (never hardcode in app source).
  APP_PUBLIC_URL: 'https://app.example.com'
  NEXT_PUBLIC_API_URL: 'https://api.example.com'
  NEXT_PUBLIC_APP_URL: 'https://app.example.com'
  NEXT_PUBLIC_ADMIN_URL: 'https://admin.example.com'
  NEXT_PUBLIC_DOCS_URL: 'https://docs.example.com'
  NEXT_PUBLIC_STATUS_URL: 'https://status.example.com'
  NEXT_PUBLIC_MARKETING_URL: 'https://example.com'
  CORS_ORIGINS: 'https://app.example.com,https://admin.example.com,https://www.example.com'
  COOKIE_SECURE: 'true'
  COOKIE_DOMAIN: '.example.com'
  CDN_ASSET_BASE_URL: ''
  OBJECT_STORAGE_BUCKET: ''
  OBJECT_STORAGE_REGION: ''
  OBJECT_STORAGE_ENDPOINT: ''

# NestJS microservices (@auvora/{name}-service; gateway uses gateway-service)
services:
  gateway:
    enabled: true
    image: gateway-service
    port: 4000
    replicas: 2
    exposeViaIngress: true
    ingressPath: /api
    networkPolicy:
      allowFromGateway: false
      allowFromIngress: true
    resources: {}
    hpa: {}
  auth:
    enabled: true
    image: auth-service
    port: 4001
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  wallet:
    enabled: true
    image: wallet-service
    port: 3002
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  blockchain:
    enabled: true
    image: blockchain-service
    port: 3003
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  payments:
    enabled: true
    image: payments-service
    port: 3004
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  compliance:
    enabled: true
    image: compliance-service
    port: 3005
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  notifications:
    enabled: true
    image: notifications-service
    port: 3006
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  analytics:
    enabled: true
    image: analytics-service
    port: 3007
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  ai:
    enabled: true
    image: ai-service
    port: 3008
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  custody:
    enabled: true
    image: custody-service
    port: 3009
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  observability:
    enabled: true
    image: observability-service
    port: 3010
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  market-data:
    enabled: true
    image: market-data-service
    port: 3012
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  swap:
    enabled: true
    image: swap-service
    port: 3013
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  nft:
    enabled: true
    image: nft-service
    port: 3014
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  staking:
    enabled: true
    image: staking-service
    port: 3015
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  connections:
    enabled: true
    image: connections-service
    port: 3016
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false
  bridge:
    enabled: true
    image: bridge-service
    port: 3017
    replicas: 2
    networkPolicy:
      allowFromGateway: true
      allowFromIngress: false

# Frontend apps
apps:
  web:
    enabled: true
    image: web
    port: 3000
    replicas: 2
    exposeViaIngress: true
    ingressPath: /
    healthPath: /api/health
    readyPath: /api/health
  admin:
    enabled: true
    image: admin
    port: 3001
    replicas: 2
    exposeViaIngress: true
    ingressPath: /admin
    healthPath: /api/health
    readyPath: /api/health
  docs:
    enabled: true
    image: docs
    port: 3011
    replicas: 1
    exposeViaIngress: true
    ingressPath: /
    healthPath: /api/health
    readyPath: /api/health

postgres:
  enabled: false
  image: postgres:16-alpine
  storageClass: ''
  storageSize: 10Gi
  database: auvora_wallet
  username: auvora

redis:
  enabled: false
  image: redis:7-alpine
  replicas: 1

backup:
  cronJob:
    enabled: false
    schedule: '0 2 * * *'
    image: postgres:16-alpine

ingress:
  enabled: true
  className: nginx
  # Legacy single-host mode (path-based /admin + /api). Used when hosts[] is empty.
  host: wallet.example.com
  # Preferred multi-host mode for public launch (set per environment).
  # Each entry: host + backend (web|admin|docs|gateway) + optional path (default /).
  hosts: []
  tls:
    enabled: true
    secretName: auvora-wallet-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
    nginx.ingress.kubernetes.io/limit-rps: '50'
    nginx.ingress.kubernetes.io/limit-connections: '20'
    # HSTS at ingress (TLS terminator). Apps also set HSTS when NODE_ENV=production.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";

rbac:
  create: true

serviceAccount:
  create: true

# Secrets are externally managed in non-local environments.
# Never commit real credentials. Local chart Secret is opt-in via secrets.create.
secrets:
  create: false
  existingSecretName: ''
  data: {}
  externalSecret:
    enabled: true
    refreshInterval: 1h
    remoteKey: auvora/production/app
    secretStoreRef:
      name: auvora-cluster-secret-store
      kind: ClusterSecretStore
    keys:
      - DATABASE_URL
      - REDIS_URL
      - POSTGRES_PASSWORD
      - JWT_ACCESS_SECRET
      - JWT_REFRESH_SECRET
      - INTERNAL_API_KEY
      - CSRF_SECRET
      - COOKIE_DOMAIN
      - APP_PUBLIC_URL
      - NEXT_PUBLIC_API_URL
      - CORS_ORIGINS
      - OBJECT_STORAGE_ACCESS_KEY
      - OBJECT_STORAGE_SECRET_KEY
      - CDN_ASSET_BASE_URL
      - ALCHEMY_API_KEY
