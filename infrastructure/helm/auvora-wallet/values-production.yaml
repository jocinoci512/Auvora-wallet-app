global:
  namespace: auvora-production
  environment: production
  imageTag: '1.2.0'
  pullPolicy: IfNotPresent
  deploymentStrategy: rolling
  blueGreen:
    slot: blue
    activeSlot: blue
  canary:
    replicas: 1
    weightPercent: 10
  hpa:
    minReplicas: 3
    maxReplicas: 20
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi

ingress:
  # Multi-host public launch surfaces (override via --set / sealed values if DNS differs).
  host: auvorawallet.com
  hosts:
    - host: auvorawallet.com
      backend: web
      port: 3000
      path: /
    - host: www.auvorawallet.com
      backend: web
      port: 3000
      path: /
    - host: app.auvorawallet.com
      backend: web
      port: 3000
      path: /
    - host: api.auvorawallet.com
      backend: gateway
      port: 4000
      path: /
    - host: admin.auvorawallet.com
      backend: admin
      port: 3001
      path: /
    - host: docs.auvorawallet.com
      backend: docs
      port: 3011
      path: /
    - host: auvorawallet.com
      backend: web
      port: 3000
      path: /status
  tls:
    enabled: true
    secretName: auvora-wallet-prod-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
    nginx.ingress.kubernetes.io/limit-rps: '80'
    nginx.ingress.kubernetes.io/limit-connections: '40'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";

config:
  NODE_ENV: production
  LOG_LEVEL: warn
  OTEL_ENABLED: 'true'
  APP_PUBLIC_URL: 'https://auvorawallet.com'
  NEXT_PUBLIC_API_URL: 'https://api.auvorawallet.com'
  NEXT_PUBLIC_APP_URL: 'https://auvorawallet.com'
  NEXT_PUBLIC_ADMIN_URL: 'https://admin.auvorawallet.com'
  NEXT_PUBLIC_DOCS_URL: 'https://docs.auvorawallet.com'
  NEXT_PUBLIC_STATUS_URL: 'https://auvorawallet.com/status'
  NEXT_PUBLIC_MARKETING_URL: 'https://auvorawallet.com'
  # Include app/admin hosts that ingress serves (credentialed browser calls).
  CORS_ORIGINS: 'https://auvorawallet.com,https://www.auvorawallet.com,https://app.auvorawallet.com,https://admin.auvorawallet.com'
  COOKIE_SECURE: 'true'
  # Host-only on API host unless cross-subdomain cookie sharing is required.
  COOKIE_DOMAIN: ''
  CDN_ASSET_BASE_URL: 'https://cdn.auvorawallet.com'
  OBJECT_STORAGE_BUCKET: 'auvora-wallet-prod-assets'
  OBJECT_STORAGE_REGION: 'us-east-1'
  AUTH_SERVICE_URL: 'http://auth:4001'
  WALLET_SERVICE_URL: 'http://wallet:3002'
  BLOCKCHAIN_SERVICE_URL: 'http://blockchain:3003'
  PAYMENTS_SERVICE_URL: 'http://payments:3004'
  COMPLIANCE_SERVICE_URL: 'http://compliance:3005'
  NOTIFICATIONS_SERVICE_URL: 'http://notifications:3006'
  ANALYTICS_SERVICE_URL: 'http://analytics:3007'
  AI_SERVICE_URL: 'http://ai:3008'
  CUSTODY_SERVICE_URL: 'http://custody:3009'
  OBSERVABILITY_SERVICE_URL: 'http://observability:3010'
  MARKET_DATA_SERVICE_URL: 'http://market-data:3012'
  SWAP_SERVICE_URL: 'http://swap:3013'
  # NFT product ABSENT — URL kept for schema compat; workers + deploy disabled.
  NFT_SERVICE_URL: 'http://nft:3014'
  NFT_WORKERS_ENABLED: 'false'
  STAKING_SERVICE_URL: 'http://staking:3015'
  CONNECTIONS_SERVICE_URL: 'http://connections:3016'
  BRIDGE_SERVICE_URL: 'http://bridge:3017'
  # Pin simulators OFF — several service schemas default true without prod throw.
  SWAP_SIMULATOR_ENABLED: 'false'
  STAKING_SIMULATOR_ENABLED: 'false'
  BRIDGE_SIMULATOR_ENABLED: 'false'
  CONNECTIONS_SIMULATOR_ENABLED: 'false'
  MARKET_DATA_SIMULATOR_ENABLED: 'false'
  NFT_SIMULATOR_ENABLED: 'false'
  BLOCKCHAIN_SIMULATOR_ENABLED: 'false'
  PAYMENTS_SIMULATOR_ENABLED: 'false'
  AI_SIMULATOR_ENABLED: 'false'
  NOTIFICATIONS_SIMULATOR_ENABLED: 'false'
  CUSTODY_SIMULATOR_ENABLED: 'false'
  COMPLIANCE_SIMULATOR_ENABLED: 'false'

# NFT product ABSENT — do not schedule nft pods in production.
services:
  nft:
    enabled: false

postgres:
  enabled: false

redis:
  enabled: false

backup:
  cronJob:
    enabled: true
    schedule: '0 2 * * *'

secrets:
  create: false
  existingSecretName: ''
  externalSecret:
    enabled: true
    remoteKey: auvora/production/app
    secretStoreRef:
      name: auvora-cluster-secret-store
      kind: ClusterSecretStore
