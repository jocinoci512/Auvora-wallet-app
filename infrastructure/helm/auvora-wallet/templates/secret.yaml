{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auvora-wallet.fullname" . }}-secrets
  namespace: {{ include "auvora-wallet.namespace" . }}
  labels:
    {{- include "auvora-wallet.labels" . | nindent 4 }}
  annotations:
    auvora.io/secret-source: chart-local-only
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
