suite: external secrets
templates:
  - external-secret.yaml
  - secret.yaml
tests:
  - it: should render ExternalSecret and skip chart Secret when create=false
    set:
      secrets:
        create: false
        externalSecret:
          enabled: true
          refreshInterval: 1h
          remoteKey: auvora/production/app
          secretStoreRef:
            name: auvora-cluster-secret-store
            kind: ClusterSecretStore
          keys:
            - DATABASE_URL
            - JWT_ACCESS_SECRET
    asserts:
      # ExternalSecret renders; the chart-local Secret is skipped (create=false).
      - hasDocuments:
          count: 1
        template: external-secret.yaml
      - hasDocuments:
          count: 0
        template: secret.yaml
      - isKind:
          of: ExternalSecret
        template: external-secret.yaml
      - equal:
          path: spec.target.name
          value: RELEASE-NAME-auvora-wallet-secrets
        template: external-secret.yaml
