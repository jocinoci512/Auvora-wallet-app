suite: canary deployments
templates:
  - services.yaml
tests:
  - it: should render stable and canary deployments
    set:
      global:
        deploymentStrategy: canary
        canary:
          replicas: 1
      services:
        gateway:
          enabled: true
          image: gateway-service
          port: 4000
          replicas: 2
          networkPolicy:
            allowFromGateway: false
            allowFromIngress: true
        auth:
          enabled: false
        wallet:
          enabled: false
        blockchain:
          enabled: false
        payments:
          enabled: false
        compliance:
          enabled: false
        notifications:
          enabled: false
        analytics:
          enabled: false
        ai:
          enabled: false
        custody:
          enabled: false
        observability:
          enabled: false
        market-data:
          enabled: false
        swap:
          enabled: false
        nft:
          enabled: false
        staking:
          enabled: false
        connections:
          enabled: false
        bridge:
          enabled: false
    asserts:
      # gateway-only, canary strategy renders, in template order:
      #   0 ServiceAccount, 1 Deployment (gateway/stable), 2 Deployment (gateway-canary),
      #   3 Service (gateway-canary), 4 Service (gateway/stable), 5 HPA, 6 PDB, 7 NetworkPolicy.
      # NOTE: every non-gateway service must be disabled above (set merges with values.yaml),
      # otherwise additional services render and shift these indices.
      - hasDocuments:
          count: 8
      - equal:
          path: metadata.name
          value: gateway
        documentIndex: 1
      - equal:
          path: metadata.name
          value: gateway-canary
        documentIndex: 2
      - equal:
          path: metadata.name
          value: gateway-canary
        documentIndex: 3
