suite: gateway service smoke
templates:
  - services.yaml
tests:
  - it: should render gateway deployment with probes and HPA
    set:
      global:
        deploymentStrategy: rolling
      services:
        gateway:
          enabled: true
          image: gateway-service
          port: 4000
          replicas: 2
          networkPolicy:
            allowFromGateway: false
            allowFromIngress: true
        auth:
          enabled: false
        wallet:
          enabled: false
        blockchain:
          enabled: false
        payments:
          enabled: false
        compliance:
          enabled: false
        notifications:
          enabled: false
        analytics:
          enabled: false
        ai:
          enabled: false
        custody:
          enabled: false
        observability:
          enabled: false
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: metadata.name
          value: gateway
        documentIndex: 1
      - isKind:
          of: Deployment
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
        documentIndex: 1
      - isKind:
          of: HorizontalPodAutoscaler
        documentIndex: 3
      - isKind:
          of: NetworkPolicy
        documentIndex: 4

  - it: should render blue-green slot deployment name
    set:
      global:
        deploymentStrategy: blue-green
        blueGreen:
          slot: green
          activeSlot: blue
      services:
        gateway:
          enabled: true
          image: gateway-service
          port: 4000
          replicas: 2
          networkPolicy:
            allowFromGateway: false
            allowFromIngress: true
        auth:
          enabled: false
        wallet:
          enabled: false
        blockchain:
          enabled: false
        payments:
          enabled: false
        compliance:
          enabled: false
        notifications:
          enabled: false
        analytics:
          enabled: false
        ai:
          enabled: false
        custody:
          enabled: false
        observability:
          enabled: false
    asserts:
      - equal:
          path: metadata.name
          value: gateway-green
        documentIndex: 1
      - equal:
          path: spec.selector.matchLabels["auvora.io/slot"]
          value: blue
        documentIndex: 2
