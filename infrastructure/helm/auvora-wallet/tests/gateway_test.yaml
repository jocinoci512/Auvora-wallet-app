suite: gateway service smoke
templates:
  - services.yaml
tests:
  - it: should render gateway deployment with probes and HPA
    set:
      global:
        deploymentStrategy: rolling
      services:
        gateway:
          enabled: true
          image: gateway-service
          port: 4000
          replicas: 2
          networkPolicy:
            allowFromGateway: false
            allowFromIngress: true
        auth:
          enabled: false
        wallet:
          enabled: false
        blockchain:
          enabled: false
        payments:
          enabled: false
        compliance:
          enabled: false
        notifications:
          enabled: false
        analytics:
          enabled: false
        ai:
          enabled: false
        custody:
          enabled: false
        observability:
          enabled: false
        market-data:
          enabled: false
        swap:
          enabled: false
        nft:
          enabled: false
        staking:
          enabled: false
        connections:
          enabled: false
        bridge:
          enabled: false
    asserts:
      # gateway-only, rolling strategy renders, in template order:
      #   0 ServiceAccount, 1 Deployment, 2 Service, 3 HPA, 4 PDB, 5 NetworkPolicy.
      # Disable every non-gateway service above (set merges with values.yaml).
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.name
          value: gateway
        documentIndex: 1
      - isKind:
          of: Deployment
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
        documentIndex: 1
      - isKind:
          of: HorizontalPodAutoscaler
        documentIndex: 3
      - isKind:
          of: PodDisruptionBudget
        documentIndex: 4
      - isKind:
          of: NetworkPolicy
        documentIndex: 5

  - it: should render blue-green slot deployment name
    set:
      global:
        deploymentStrategy: blue-green
        blueGreen:
          slot: green
          activeSlot: blue
      services:
        gateway:
          enabled: true
          image: gateway-service
          port: 4000
          replicas: 2
          networkPolicy:
            allowFromGateway: false
            allowFromIngress: true
        auth:
          enabled: false
        wallet:
          enabled: false
        blockchain:
          enabled: false
        payments:
          enabled: false
        compliance:
          enabled: false
        notifications:
          enabled: false
        analytics:
          enabled: false
        ai:
          enabled: false
        custody:
          enabled: false
        observability:
          enabled: false
        market-data:
          enabled: false
        swap:
          enabled: false
        nft:
          enabled: false
        staking:
          enabled: false
        connections:
          enabled: false
        bridge:
          enabled: false
    asserts:
      # Deployment (doc 1) is named for the release slot; the stable Service
      # (doc 2) routes traffic to the active slot via spec.selector.
      - equal:
          path: metadata.name
          value: gateway-green
        documentIndex: 1
      - equal:
          path: spec.selector["auvora.io/slot"]
          value: blue
        documentIndex: 2
