# Auvora notifications-prod — dedicated Railway config-as-code.
#
# WHY THIS FILE EXISTS:
# Root `railway.toml` is shared by Nest mesh services. notifications-prod must use
# an explicit startCommand + dedicated docs so it does not inherit legacy
# start paths.
# Set:
#   Config as Code path = /railway.notifications.toml
#
# Railway service settings:
#   Service name       = notifications-prod
#   Repository         = jocinoci512/Auvora-wallet-app
#   Branch             = main
#   Root Directory     = blank / "/"
#   Builder            = Dockerfile (pinned below)
#   Dockerfile path    = infrastructure/docker/Dockerfile.service (pinned below)
#   Config as Code     = /railway.notifications.toml
#   Healthcheck path   = /health (pinned below)
#   Public networking  = OFF (private mesh only — gateway is the public edge)
#
# BUILD ARGS:
# Set service Variables SERVICE=notifications and PORT=3006 so Dockerfile.service
# receives matching ARG values at build time.
#
# REQUIRED non-secret Variables:
#   SERVICE=notifications
#   PORT=3006
#   NODE_ENV=production
#   LOG_LEVEL=info
#   NOTIFICATIONS_SIMULATOR_ENABLED=false
#   NOTIFICATIONS_QUEUE_WORKER_ENABLED=true
#   NOTIFICATIONS_WEBHOOK_WORKER_ENABLED=true
#   NOTIFICATIONS_CHANNEL_IN_APP_ENABLED=true
#   NOTIFICATIONS_CHANNEL_EMAIL_ENABLED=true
#   OTEL_ENABLED=false
#
# REQUIRED secret / reference Variables:
#   DATABASE_URL=${{Postgres.DATABASE_URL}}
#   REDIS_URL=${{Redis.REDIS_URL}}
#   JWT_ACCESS_SECRET=${{ "auth-prods".JWT_ACCESS_SECRET }}
#   CSRF_SECRET=${{ "auth-prods".CSRF_SECRET }}
#   INTERNAL_API_KEY=${{ "gateway-prod".INTERNAL_API_KEY }}
#   NOTIFICATIONS_FIELD_ENCRYPTION_KEY=<32-char secret>

[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/docker/Dockerfile.service"

[deploy]
startCommand = "node dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
