name: Image Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'infrastructure/docker/**'
      - '.github/workflows/image-scan.yml'

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner (fs)
        # Pin immutable commit for aquasecurity/trivy-action@v0.36.0
        # (post GHSA-69fq-xp46-6x23; pins setup-trivy@v0.2.6 + safe Trivy binary).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif
          # Explicit safe binary (advisory-listed); avoid floating "latest".
          version: v0.69.3
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
