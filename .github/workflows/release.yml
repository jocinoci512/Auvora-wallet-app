name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Semver without v prefix
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Auvora Wallet ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          body: |
            ## Production infrastructure release

            - Helm chart: `infrastructure/helm/auvora-wallet` (appVersion aligned to tag)
            - Deploy via Actions → Deploy workflow with `image_tag` = this release
            - See `docs/DEPLOYMENT_GUIDE.md` and `docs/DISASTER_RECOVERY.md`
