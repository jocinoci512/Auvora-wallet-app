name: Sign Images

on:
  workflow_run:
    workflows: ['Build Images']
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to sign (git sha)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  cosign:
    name: Cosign sign service images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - gateway-service
          - auth-service
          - wallet-service
          - blockchain-service
          - payments-service
          - compliance-service
          - notifications-service
          - analytics-service
          - ai-service
          - custody-service
          - observability-service
          - web
          - admin
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}:${{ steps.tag.outputs.value }}"
          cosign sign --yes "$IMAGE" || echo "Sign skipped (image may not exist yet): $IMAGE"
