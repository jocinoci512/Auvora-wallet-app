name: Build Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'apps/**'
      - 'packages/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/build-images.yml'

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-services:
    name: Build Nest service images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth
          - wallet
          - blockchain
          - payments
          - compliance
          - notifications
          - analytics
          - ai
          - custody
          - observability
        include:
          - service: gateway
            port: '4000'
          - service: auth
            port: '4001'
          - service: wallet
            port: '3002'
          - service: blockchain
            port: '3003'
          - service: payments
            port: '3004'
          - service: compliance
            port: '3005'
          - service: notifications
            port: '3006'
          - service: analytics
            port: '3007'
          - service: ai
            port: '3008'
          - service: custody
            port: '3009'
          - service: observability
            port: '3010'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.service
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}-service:${{ github.sha }}
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-apps:
    name: Build Next app images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: web
            port: '3000'
          - app: admin
            port: '3001'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.next
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.app }}:${{ github.sha }}
          build-args: |
            APP=${{ matrix.app }}
            PORT=${{ matrix.port }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
