# Auvora NestJS services (auth, gateway, wallet, …) — shared Docker image.
# Config-as-code overrides the Railway dashboard and pins the Dockerfile so
# deploys do not fail silently when the UI Dockerfile path is empty/wrong.
#
# railway.toml does NOT support Docker buildArgs. Per service, set Variables:
#   SERVICE=<name>   e.g. auth          (required — image build fails if unset)
#   PORT=<port>      e.g. 4001
# See infrastructure/docker/README.md and docs/RAILWAY_SERVICE_MATRIX.md.
#
# Root Directory must be repo root (blank or "/"), never a subdirectory.
# Shared healthcheckPath /health is correct for all Nest services.
# Next.js apps must use a different config-as-code file / Dockerfile.next.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/docker/Dockerfile.service"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
