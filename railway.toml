# Auvora NestJS services (auth, gateway, wallet, …) — shared Docker image.
# Config-as-code overrides the Railway dashboard and pins the Dockerfile so
# deploys do not fail silently when the UI Dockerfile path is empty/wrong.
#
# Per service, set Variables (build-time ARGs + runtime):
#   SERVICE=<name>   e.g. auth
#   PORT=<port>      e.g. 4001
# Root Directory must be repo root (blank or "/"), never a subdirectory.
# Next.js apps must use a different config-as-code file / Dockerfile.next.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/docker/Dockerfile.service"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
