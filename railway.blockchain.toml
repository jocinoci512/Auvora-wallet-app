# Auvora blockchain-prod — dedicated Railway config-as-code.
#
# WHY THIS FILE EXISTS:
# Root `railway.toml` is shared by Nest mesh services. blockchain-prod must use
# an explicit startCommand + dedicated docs so it does not inherit legacy
# Railpack-style `node services/blockchain/dist/main.js` start paths.
# Create a NEW Railway service named `blockchain-prod` and set:
#   Config as Code path = /railway.blockchain.toml
# Do NOT modify gateway-prod or auth-prods from this file.
#
# Railway service settings (dashboard — create new service, do not deploy from agent):
#   Service name       = blockchain-prod
#   Repository         = jocinoci512/Auvora-wallet-app
#   Branch             = main
#   Root Directory     = blank / "/"
#   Builder            = Dockerfile (pinned below)
#   Dockerfile path    = infrastructure/docker/Dockerfile.service (pinned below)
#   Config as Code     = /railway.blockchain.toml
#   Healthcheck path   = /health (pinned below)
#   Public networking  = OFF (private mesh only — gateway is the public edge)
#   Pre-Deploy Command = EMPTY (omit; do not set)
#   Custom Start Cmd   = MUST be set in [deploy] below.
#
# BUILD ARGS — Railway config-as-code does NOT support a `buildArgs` key.
# Set service Variables SERVICE=blockchain and PORT=3003 so Dockerfile.service
# receives matching ARG values at build time.
#
# REQUIRED non-secret Variables:
#   SERVICE=blockchain
#   PORT=3003
#   NODE_ENV=production
#   LOG_LEVEL=warn
#   BLOCKCHAIN_SIMULATOR_ENABLED=false
#   BLOCKCHAIN_LIVE_BROADCAST=false
#   BLOCKCHAIN_PRIMARY_PROVIDER=alchemy
#   ALCHEMY_REQUIRED=true
#   OTEL_ENABLED=false
#
# REQUIRED secret / reference Variables (set in Railway UI; never commit values):
#   DATABASE_URL=${{Postgres.DATABASE_URL}}
#     → same Railway Postgres plugin reference used by auth-prods
#   REDIS_URL=${{Redis.REDIS_URL}}
#     → same Railway Redis plugin reference used by auth-prods
#     (if your Redis plugin exposes REDIS_URL under a different service name,
#      use that exact name — match auth-prods)
#   INTERNAL_API_KEY=<reuse existing shared mesh secret — do not regenerate>
#   JWT_ACCESS_SECRET=<reuse existing shared JWT access secret>
#   CSRF_SECRET=<reuse existing shared CSRF secret>
#   ALCHEMY_API_KEY=<server-side Alchemy key only — never on Vercel/web>
#
# OPTIONAL (leave unset unless needed):
#   ALCHEMY_*_RPC_URL overrides, CUSTODY_SERVICE_URL, NOTIFICATIONS_SERVICE_URL,
#   AI_SERVICE_URL, ANALYTICS_SERVICE_URL, OBSERVABILITY_SERVICE_URL
#
# FORBIDDEN on blockchain-prod:
#   Reown / WalletConnect client keys (WC_PROJECT_ID, Reown secrets)
#   wallet private keys, mnemonics, seed phrases
#   server-side user signing keys
#   BLOCKCHAIN_LIVE_BROADCAST=true (production boot rejects this)
#   Reown / WalletConnect client keys (WC_PROJECT_ID, Reown secrets)
#   wallet private keys, mnemonics, seed phrases
#   server-side user signing keys
#
# After blockchain-prod is healthy, wire gateway-prod:
#   BLOCKCHAIN_SERVICE_URL=http://${{blockchain-prod.RAILWAY_PRIVATE_DOMAIN}}:3003

[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/docker/Dockerfile.service"

[deploy]
# Explicit override: clears legacy dashboard / Railpack start
# `node services/blockchain/dist/main.js`. Matches Dockerfile.service CMD.
startCommand = "node dist/main.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
