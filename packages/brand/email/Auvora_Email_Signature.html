<html lang="en">
  <head>

    <title>Auvora email signature</title>

      cellpadding="0"
      cellspacing="0"
      style="font-family: Arial, sans-serif; color: #102d32"

          <img

        <td

            border-top: 2px solid #087f75;

          <strong>Auvora Wallet Team</strong><br />
